name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/utils is pure -- no DOM, no network, no Supabase -- so these run
      # without any environment at all, and they cover the arithmetic that
      # decides what someone's collection is worth.
      - name: Unit tests
        run: npm test

      # Only the undefined-variable rule, because only that one is clean. The
      # rest of `npm run lint` still reports a pre-existing backlog in
      # InventoryApp.jsx and the books pages; gating on the whole thing today
      # would fail every PR. This gates the one rule that catches a crash
      # neither the build nor the tests above can see -- see the note in
      # eslint.config.mjs for the two that reached production.
      #
      # `--quiet` drops warnings, so a `<img>` advisory cannot fail the build.
      - name: Undefined variables
        run: npx eslint . --quiet -f json --output-file eslint.json || true

      - name: Fail on any undefined variable
        run: |
          node -e '
            const found = require("./eslint.json").flatMap((file) =>
              file.messages
                .filter((message) => message.ruleId === "no-undef")
                .map((message) => `${file.filePath}:${message.line}  ${message.message}`)
            );
            if (found.length === 0) process.exit(0);
            console.error("Undefined variables -- these throw at runtime:");
            found.forEach((line) => console.error("  " + line));
            process.exit(1);
          '

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The Supabase browser client throws at import time when these are missing,
    # which would fail the build during static generation. These are throwaway
    # placeholders, not credentials: nothing in CI talks to a real database, and
    # a fork's PR could not be trusted with real ones anyway.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
